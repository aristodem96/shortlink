name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum \
            || (echo "::error::go.mod/go.sum are out of date - run 'make tidy'" && exit 1)

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # v8 of the action is the one that runs golangci-lint v2, which is the
      # schema .golangci.yml is written against.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Includes the testcontainers-backed integration tests: the GitHub
      # runners ship a working Docker daemon, so the SQL and the Lua rate
      # limiter are exercised against real Postgres and Redis rather than mocks.
      - name: Run tests
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only: nothing is pushed, so the workflow needs no registry
      # credentials and is safe to run on a fork's pull request.
      - name: Build the container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shortlink:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint /shortlinkctl shortlink:ci help
