version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose      # a leaked response body leaks a connection
    - contextcheck   # catches a dropped or wrong context
    - copyloopvar
    - errorlint      # enforces errors.Is/As over == and type switches
    - gocritic
    - gosec
    - misspell
    - nilerr         # returning nil after a non-nil error is almost always a bug
    - noctx
    - prealloc
    - revive
    - rowserrcheck   # a missed rows.Err() silently truncates a result set
    - sqlclosecheck
    - unconvert
    - unparam
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
    # govet's `shadow` check is deliberately left off: it flags
    # `if err := f(); err != nil` whenever an outer `err` exists, which is
    # ordinary Go and not a bug worth restructuring code around.
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
    gosec:
      excludes:
        # G404 flags math/rand. Short codes use crypto/rand; anything left is
        # non-security jitter.
        - G404

  exclusions:
    rules:
      # Tests deliberately ignore errors from helpers and use long, literal
      # fixtures; holding them to the production rules adds noise, not safety.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - shortlink
