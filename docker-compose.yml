# Pin the project name instead of letting Docker derive it from the directory.
#
# By default compose names containers and volumes after the folder it is run
# from, so a clone into /opt/shortlink and a clone into ~/short_link would each
# get their own database. Worse, renaming or moving the directory later makes
# Docker create a fresh empty volume, and the old data looks lost even though
# it is still on disk under the previous name. Pinning the name makes the
# location of the checkout irrelevant to the data.
name: shortlink

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: shortlink
      POSTGRES_DB: shortlink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlink -d shortlink"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      POSTGRES_DSN: postgres://shortlink:shortlink@postgres:5432/shortlink?sslmode=disable
      REDIS_ADDR: redis:6379
      IP_HASH_SALT: ${IP_HASH_SALT:-local-dev-salt}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}

      # Compose passes nothing into a container unless it is named here, so
      # without these lines every tuning knob in .env.example would be silently
      # ignored under `docker compose up` while still working under `make run`.
      # CODE_LENGTH is the one that matters most: the bot already reads it, and
      # if the API did not, the two would mint short codes of different lengths.
      # Each falls back to the value the service uses by default, so an
      # untouched .env changes nothing.
      CODE_LENGTH: ${CODE_LENGTH:-7}
      # False unless you really do put a proxy in front of this stack, as the
      # "Running behind an existing nginx" section of DEPLOYMENT.md describes.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
      CACHE_TTL: ${CACHE_TTL:-1h}
      CACHE_NEGATIVE_TTL: ${CACHE_NEGATIVE_TTL:-30s}
      POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-10}
      CLICKS_BUFFER_SIZE: ${CLICKS_BUFFER_SIZE:-10000}
      CLICKS_WORKERS: ${CLICKS_WORKERS:-2}
      CLICKS_BATCH_SIZE: ${CLICKS_BATCH_SIZE:-500}
      CLICKS_FLUSH_INTERVAL: ${CLICKS_FLUSH_INTERVAL:-2s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-5s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-10s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-15s}
    ports:
      # Override with API_PORT when 8080 is taken on the host.
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  # The Telegram bot that sells API access. Behind a profile because it needs
  # two tokens the rest of the stack does not, so a plain `docker compose up`
  # still works for anyone who has not set them. Start it with
  # `docker compose --profile bot up -d`, or put COMPOSE_PROFILES=bot in .env.
  bot:
    profiles: ["bot"]
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    entrypoint: ["/bot"]
    # Published in development so the payment webhook can be exercised locally,
    # by hand or through a tunnel. The production overlay does not publish it:
    # there Caddy is the only way in.
    ports:
      - "${BOT_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://shortlink:shortlink@postgres:5432/shortlink?sslmode=disable
      # The bot shortens links through the same service as the API, which clears
      # a code's cached "not found" the moment that code is taken.
      REDIS_ADDR: redis:6379
      # Must match the API's, so links made in the chat look like the rest.
      CODE_LENGTH: ${CODE_LENGTH:-7}
      # Not ${VAR:?}: compose interpolates every service, including ones behind
      # an inactive profile, so a required variable here would break a plain
      # `docker compose up` for anyone who never meant to run the bot. The bot
      # validates its own configuration and names what is missing when it is
      # actually started.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      CRYPTOPAY_TOKEN: ${CRYPTOPAY_TOKEN:-}
      # Test coins unless deliberately changed.
      CRYPTOPAY_NETWORK: ${CRYPTOPAY_NETWORK:-testnet}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      PRICE_USD: ${PRICE_USD:-10}
      ACCESS_DAYS: ${ACCESS_DAYS:-5}
      MAX_KEYS_PER_USER: ${MAX_KEYS_PER_USER:-5}
      CRYPTOPAY_ASSETS: ${CRYPTOPAY_ASSETS:-USDT,TON}
      CUSTOM_DOMAIN_PRICE_USD: ${CUSTOM_DOMAIN_PRICE_USD:-5}
      # Empty locally: there is no public address to point a domain at, so the
      # A-record check is skipped and any hostname can be registered for
      # testing. Production sets this and the check becomes real.
      SERVER_IP: ${SERVER_IP:-}
      INVOICE_TTL: ${INVOICE_TTL:-1h}
      # Locally this is what makes payments land at all: Crypto Pay has no public
      # URL to deliver a webhook to, so the invoice is confirmed by polling.
      RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-20s}
      BOT_TIMEZONE: ${BOT_TIMEZONE:-Europe/Kyiv}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    restart: unless-stopped

volumes:
  pgdata:
